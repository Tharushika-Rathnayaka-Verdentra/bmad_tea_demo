name: E2E Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    # Nightly at 02:00 UTC; the target is a live external site, so this catches upstream drift.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  SHARD_TOTAL: 2

jobs:
  burn-in:
    name: Burn-in changed specs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Detect changed specs
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --diff-filter=AM "$BASE_SHA" "$HEAD_SHA" -- 'tests/**/*.spec.ts' > changed-specs.txt
          COUNT=$(grep -c . changed-specs.txt || true)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Changed specs ($COUNT):"
          cat changed-specs.txt

      - name: Run burn-in (5 iterations, no retries)
        if: steps.changed.outputs.count != '0'
        run: |
          mapfile -t SPECS < changed-specs.txt
          npm run test:burn-in -- "${SPECS[@]}"

      - name: Upload burn-in failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: burn-in-failure-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  e2e:
    name: E2E (shard ${{ matrix.shard }}/2)
    needs: burn-in
    # Run on push/schedule/dispatch (burn-in skipped) and on PRs once burn-in passes.
    if: always() && (needs.burn-in.result == 'success' || needs.burn-in.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Run E2E tests
        run: npm run test:ci -- --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }}

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  report:
    name: Merge reports
    needs: e2e
    if: always() && needs.e2e.result != 'skipped' && needs.e2e.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports/
          merge-multiple: true

      - name: Merge into HTML and JUnit reports
        run: npm run test:ci:merge -- all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload JUnit report
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: test-results/junit.xml
          retention-days: 30

      - name: Summarize results
        run: |
          {
            echo "## E2E results"
            echo
            echo "- Shards: ${SHARD_TOTAL}"
            echo "- Outcome: ${E2E_RESULT}"
            echo "- Reports: see the \`playwright-report\` and \`junit-results\` artifacts on this run."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          E2E_RESULT: ${{ needs.e2e.result }}

      - name: Fail if any shard failed
        if: needs.e2e.result != 'success'
        run: exit 1
